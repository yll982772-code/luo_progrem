<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>勇者传说</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a2e;color:#fff;min-height:100vh}
.scr{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.scr.on{display:flex}
.card{width:100%;max-width:380px;background:rgba(20,15,50,0.92);border:2px solid rgba(255,215,0,0.2);border-radius:16px;padding:28px 22px;text-align:center}
.tit{font-size:26px;font-weight:bold;color:#ffd700;margin-bottom:6px;text-shadow:0 0 15px rgba(255,215,0,0.3)}
.sub{font-size:14px;color:#ccbbff;margin-bottom:20px}
.rw{display:flex;align-items:center;margin-bottom:14px}
.rw label{width:70px;font-size:13px;color:#bbaacc;text-align:right;margin-right:8px}
.rw input{flex:1;height:40px;background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;font-size:14px;padding:0 12px;outline:none}
.rw input:focus{border-color:rgba(255,215,0,0.5)}
.cap{display:inline-block;background:repeating-linear-gradient(45deg,#1a1040,#1a1040 4px,#221450 4px,#221450 8px);color:#ffdd44;font-size:20px;letter-spacing:5px;padding:8px 16px;border-radius:8px;border:2px dashed rgba(255,215,0,0.35);cursor:pointer;margin:6px 0 16px}
.btn{display:block;width:100%;height:46px;line-height:46px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px;text-align:center}
.bg{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#3a2000}
.bp{background:linear-gradient(135deg,#9944ff,#6622cc);color:#fff}
.lk{font-size:13px;color:#aa99dd;margin-top:14px;cursor:pointer;text-decoration:underline}
.pts{font-size:22px;font-weight:bold;color:#ffd700;margin-bottom:18px}
.arw{display:flex;align-items:center;margin-bottom:16px}
.arw span:first-child{width:65px;font-size:13px;color:#ccbbff;text-align:right;margin-right:8px}
.arw input{width:56px;height:36px;background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-size:14px;text-align:center;outline:none;margin:0 5px}
.arw .hi{font-size:10px;color:#778;flex:1}
.arw .st{font-size:12px;color:#889}
.btbg{background:linear-gradient(180deg,#1a0a3e 0,#2d1050 40%,#3a2060 70%,#1a3020 100%)}
.btop{width:100%;display:flex;justify-content:space-between;padding:8px 14px;font-size:12px;color:#ccbbff}
.fld{flex:1;width:100%;display:flex;align-items:center;justify-content:space-around;padding:8px;position:relative}
.csl{display:flex;flex-direction:column;align-items:center;width:130px}
.hpw{width:100%;margin-bottom:5px}
.hpn{font-size:11px;color:#ccbbff;text-align:center;display:block}
.hpo{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden}
.hpi{height:100%;border-radius:4px;transition:width .3s}
.hpp{font-size:10px;color:#fff;text-align:center;display:block;margin-top:2px}
.chr{width:85px;height:130px;position:relative;display:flex;flex-direction:column;align-items:center}
.chr .face{width:50px;height:50px;background:#ffcc88;border-radius:50%;position:relative;z-index:1}
.chr .face::before,.chr .face::after{content:"";position:absolute;width:7px;height:8px;background:#333;border-radius:50%;top:18px}
.chr .face::before{left:11px}.chr .face::after{right:11px}
.chr .face .mh{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:14px;height:6px;border-bottom:2.5px solid #c64;border-radius:0 0 8px 8px}
.chr .body{width:55px;height:45px;border-radius:10px;margin-top:-8px;z-index:0}
.plr .body{background:linear-gradient(135deg,#ffe066,#ff9900)}
.war .body{background:linear-gradient(135deg,#4488ff,#2266cc)}
.ass .body{background:linear-gradient(135deg,#7744cc,#442288)}
.tnk .body{background:linear-gradient(135deg,#99aabb,#667788)}
.mag .body{background:linear-gradient(135deg,#cc44aa,#8822aa)}
.vs{font-size:22px;font-weight:bold;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.4)}
.lga{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);text-align:center;max-width:280px}
.lgt{display:block;font-size:13px;color:#fff;background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:6px;margin-bottom:3px}
.dmg{color:#ff6644;font-size:20px;font-weight:bold;animation:pop .8s forwards}
.dmg.hl{color:#44ff44}

@keyframes atkR{0%{transform:translateX(0)}40%{transform:translateX(30px)}100%{transform:translateX(0)}}
@keyframes atkL{0%{transform:translateX(0)}40%{transform:translateX(-30px)}100%{transform:translateX(0)}}
@keyframes hitS{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.ar{animation:atkR .35s ease}.al{animation:atkL .35s ease}.hs{animation:hitS .35s ease}

.ovl{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}

.ric{font-size:44px;margin-bottom:6px}
.rti{font-size:24px;font-weight:bold;margin-bottom:10px}
.rin{font-size:14px;color:#ccbbff;margin-bottom:18px;line-height:1.7}
.stb{background:rgba(0,0,0,0.4);border-radius:8px;padding:16px;margin:14px 0;line-height:1.8;font-size:14px;color:#ccbbff}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:10px;font-size:14px;z-index:100;color:#fff;opacity:0;transition:opacity .3s}
.toast.ok{background:#2a4;opacity:1}
.toast.er{background:#d33;opacity:1}
</style></head><body>
<div class="scr on" id="scr-login"><div class="card"><div class="tit">勇者传说</div><div class="sub">文字回合制格斗游戏</div><div class="rw"><label>用户名</label><input id="lu" placeholder="请输入用户名" maxlength="16"></div><div class="rw"><label>密码</label><input id="lp" type="password" placeholder="请输入密码" maxlength="8"></div><div class="rw"><label>验证码</label><input id="lc" placeholder="请输入验证码" maxlength="5"></div><div class="cap" id="cb">ABCD1</div><button class="btn bg" onclick="doLogin()">登 录</button><div class="lk" onclick="goScreen('register')">没有账号？去注册</div></div></div>
<div class="scr" id="scr-register"><div class="card"><div class="tit">注册账号</div><div class="rw"><label>用户名</label><input id="ru" placeholder="3到16位含字母" maxlength="16"></div><div class="rw"><label>密码</label><input id="rp1" type="password" placeholder="3到8位字母加数字" maxlength="8"></div><div class="rw"><label>确认密码</label><input id="rp2" type="password" placeholder="请再次输入" maxlength="8"></div><button class="btn bg" onclick="doRegister()">注 册</button><div class="lk" onclick="goScreen('login')">已有账号？去登录</div></div></div>
<div class="scr" id="scr-create"><div class="card"><div class="tit">创建角色</div><div class="sub">手动输入属性点数（合计20点）</div><div class="pts" id="rp">剩余属性点：20</div><div class="arw"><span>生命值</span><input type="number" id="ah" value="5" oninput="upAttr()"><span class="hi">每点+10HP</span><span class="st">HP: <b id="ph">150</b></span></div><div class="arw"><span>攻击力</span><input type="number" id="aa" value="8" oninput="upAttr()"><span class="hi">每点+2ATK</span><span class="st">ATK: <b id="pa">26</b></span></div><div class="arw"><span>防御力</span><input type="number" id="ad" value="7" oninput="upAttr()"><span class="hi">每点+1DEF</span><span class="st">DEF: <b id="pd">7</b></span></div><button class="btn bg" onclick="startGame()">开始游戏</button></div></div>
<div class="scr btbg" id="scr-battle"><div class="btop"><span>胜场：<b id="wc">0</b></span><span>第 <b id="bn">1</b> 场</span><span>第 <b id="rn">1</b> 回合</span></div><div class="fld"><div class="csl" id="ps"><div class="hpw"><span class="hpn" id="pnl">勇者</span><div class="hpo"><div class="hpi" id="pbr" style="width:100%;background:#4d4"></div></div><span class="hpp" id="php">100/100</span></div><div class="chr plr" id="pch"><div class="face"><div class="mh"></div></div><div class="body"></div></div></div><div class="vs">VS</div><div class="lga" id="la"></div><div class="csl" id="es"><div class="hpw"><span class="hpn" id="enl">敌人</span><div class="hpo"><div class="hpi" id="ebr" style="width:100%;background:#4d4"></div></div><span class="hpp" id="ehp">80/80</span></div><div class="chr war" id="ech"><div class="face"><div class="mh"></div></div><div class="body"></div></div></div></div><div class="skb" id="skb"><button class="sk" onclick="playerAction(0)">普通攻击</button><button class="sk" onclick="playerAction(1)">强力一击</button><button class="sk" onclick="playerAction(2)">生命汲取</button></div><div class="ovl" id="ov" style="display:none"><div class="ovc"><div class="ric" id="ri"></div><div class="rti" id="rt"></div><div class="rin" id="rinf"></div><button class="btn bg" id="bco" onclick="continueBattle()" style="display:none">继续下一场游戏</button><button class="btn bp" id="ben" onclick="endGame()">结束游戏</button></div></div></div>
<div class="scr" id="scr-thanks"><div class="card"><div class="tit">感谢你的游玩！</div><div class="stb" id="sb"></div><div class="sub">期待你的再次挑战，勇者！</div><button class="btn bg" onclick="restartGame()">重新开始</button></div></div>
<div class="toast" id="to"></div>
<script>
var E=[{n:"初级战士",h:80,m:80,a:15,d:10,s:"猛击",c:"war"},{n:"敏捷刺客",h:60,m:60,a:20,d:5,s:"快速攻击",c:"ass"},{n:"重装坦克",h:120,m:120,a:10,d:10,s:"防御姿态",c:"tnk"},{n:"神秘法师",h:70,m:70,a:25,d:8,s:"火球术",c:"mag"}];
var U=JSON.parse(localStorage.fg_u||"[]"),CU=null,PL=null,EM=null,EL=[],W=0,BC=1,RO=1,CP="";

rc();

</script></body></html>
